name: Прогон UI Автотестов

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

# Обязательный блок прав для публикации Allure-отчета на GitHub Pages
permissions:
  contents: write

jobs:
  run-tests:
    runs-on: self-hosted # Запуск на вашем ПК с активным VPN

    steps:
    - name: Скачивание кода из репозитория
      uses: actions/checkout@v4

    - name: Настройка Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Установка зависимостей
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Запуск тестов через Pytest (Параллельно на 2 стендах)
      env:
        PROFINANSY_USER_EMAIL: ${{ secrets.PROFINANSY_USER_EMAIL }}
        PROFINANSY_USER_PASSWORD: ${{ secrets.PROFINANSY_USER_PASSWORD }}
        CI: "true"
      # Флаг -n 2 берет ваш параметризованный fixture и пускает QA и Prod в 2 потока
      run: python -m pytest -n 2 -v --alluredir=allure-results

    - name: Генерация отчета Allure
      if: always()
      uses: simple-elf/allure-report-action@master
      with:
        allure_results: allure-results
        gh_pages: gh-pages
        allure_report: allure-report
        allure_history: allure-history

    - name: Публикация отчета на GitHub Pages
      if: always()
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_branch: gh-pages
        publish_dir: allure-history
