name: Прогон UI Автотестов

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  run-tests:
    runs-on: self-hosted

    steps:
    - name: Скачивание кода из репозитория
      uses: actions/checkout@v4

    - name: Установка зависимостей в виртуальное окружение
      run: |
        python -m venv venv
        .\venv\Scripts\python.exe -m pip install --upgrade pip
        .\venv\Scripts\pip.exe install -r requirements.txt

    - name: Запуск тестов через Pytest (Параллельно на 2 стендах)
      env:
        PROFINANSY_USER_EMAIL: ${{ secrets.PROFINANSY_USER_EMAIL }}
        PROFINANSY_USER_PASSWORD: ${{ secrets.PROFINANSY_USER_PASSWORD }}
        CI: "true"
      run: .\venv\Scripts\python.exe -m pytest -n 2 -v --alluredir=allure-results

    - name: Генерация отчета Allure
      if: always()
      uses: simple-elf/allure-report-action@master
      with:
        allure_results: allure-results
        gh_pages: gh-pages
        allure_report: allure-report
        allure_history: allure-history

    - name: Публикация отчета на GitHub Pages
      if: always()
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_branch: gh-pages
        publish_dir: allure-history
