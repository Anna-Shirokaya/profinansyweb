name: Прогон UI Автотестов

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Задача 1: Запуск автотестов на вашем Windows ПК
  run-tests:
    runs-on: self-hosted

    steps:
      - name: Скачивание кода из репозитория
        uses: actions/checkout@v4

      - name: Запуск тестов через Pytest
        env:
          PROFINANSY_USER_EMAIL: ${{ secrets.PROFINANSY_USER_EMAIL }}
          PROFINANSY_USER_PASSWORD: ${{ secrets.PROFINANSY_USER_PASSWORD }}
          CI: "true"
        run: python -m pytest -n 2 -v --alluredir=allure-results

      - name: Сохранение результатов Allure в артефакты
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results
          retention-days: 1

  # Задача 2: Генерация и публикация отчёта в облаке GitHub (Linux)
  generate-report:
    runs-on: ubuntu-latest
    needs: run-tests
    if: always()

    steps:
      - name: Загрузка результатов Allure из артефактов
        uses: actions/download-artifact@v4
        with:
          name: allure-results
          path: allure-results

      - name: Генерация отчета Allure
        uses: simple-elf/allure-report-action@master
        with:
          allure_results: allure-results
          gh_pages: gh-pages
          allure_report: allure-report
          allure_history: allure-history

      - name: Публикация отчета на GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history