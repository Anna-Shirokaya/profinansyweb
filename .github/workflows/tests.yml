name: Прогон UI Автотестов

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Скачивание кода из репозитория
      uses: actions/checkout@v4

    - name: Настройка Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Установка зависимостей
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Запуск тестов через Pytest
      env:
        PROFINANSY_USER_EMAIL: ${{ secrets.PROFINANSY_USER_EMAIL }}
        PROFINANSY_USER_PASSWORD: ${{ secrets.PROFINANSY_USER_PASSWORD }}
      # ДОБАВЛЕНО: флаг --alluredir для сбора результатов
      run: python -m pytest -v --alluredir=allure-results

    - name: Генерация отчета Allure
      # if: always() гарантирует, что отчет соберется, даже если тесты упали (а они у нас падают)
      if: always()
      uses: simple-elf/allure-report-action@master
      with:
        allure_results: allure-results
        gh_pages: gh-pages
        allure_report: allure-report
        allure_history: allure-history

    - name: Публикация отчета на GitHub Pages
      if: always()
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_branch: gh-pages
        publish_dir: allure-history
